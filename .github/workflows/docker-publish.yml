name: Docker Build and Publish (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      release-tag: ${{ steps.version.outputs.release-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # If triggered by a git tag, use the tag name (remove 'v' prefix if present)
            VERSION="${{ github.ref_name }}"
            VERSION=${VERSION#v}  # Remove 'v' prefix if present
            IS_PRERELEASE="false"
            RELEASE_TAG="${{ github.ref_name }}"
          else
            # For pushes to main, calculate version from latest tag + commits
            if git describe --tags --abbrev=0 >/dev/null 2>&1; then
              LATEST_TAG=$(git describe --tags --abbrev=0)
              LATEST_TAG_CLEAN=${LATEST_TAG#v}  # Remove 'v' prefix
              
              # Count commits since latest tag
              COMMITS_SINCE_TAG=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || echo "0")
              
              # Parse version components
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG_CLEAN"
              MAJOR=${MAJOR:-0}
              MINOR=${MINOR:-0}
              PATCH=${PATCH:-0}
              
              # Increment patch version by commits since tag
              NEW_PATCH=$((PATCH + COMMITS_SINCE_TAG))
              VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            else
              # No tags exist, start from 0.1.0
              COMMITS_SINCE_TAG=$(git rev-list --count HEAD 2>/dev/null || echo "0")
              VERSION="0.1.${COMMITS_SINCE_TAG}"
            fi
            
            IS_PRERELEASE="false"
            RELEASE_TAG="v${VERSION}"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is-prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "release-tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "📦 Calculated version: ${VERSION} (tag: ${RELEASE_TAG})"

  build-and-push:
    name: Build and push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: calculate-version
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [manager, downloader, translator, scanner, consumer]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/get-my-subtitle-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.calculate-version.outputs.version }}
            type=semver,pattern={{version}},value=${{ needs.calculate-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.calculate-version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.calculate-version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-push]
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          VERSION="${{ needs.calculate-version.outputs.version }}"
          RELEASE_TAG="${{ needs.calculate-version.outputs.release-tag }}"
          
          # Get commits since last tag or last 20 commits if no tag
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges || echo "- Initial release")
          else
            COMMITS=$(git log -20 --pretty=format:"- %s (%h)" --no-merges || echo "- Initial release")
          fi
          
          # Create release notes
          {
            echo "# Release ${RELEASE_TAG}"
            echo ""
            echo "## Changes"
            echo "${COMMITS}"
            echo ""
            echo "## Docker Images"
            echo ""
            echo "All images are available at \`ghcr.io/${{ env.IMAGE_OWNER }}/get-my-subtitle-<service>:${VERSION}\`"
            echo ""
            echo "- \`manager\`: \`ghcr.io/${{ env.IMAGE_OWNER }}/get-my-subtitle-manager:${VERSION}\`"
            echo "- \`downloader\`: \`ghcr.io/${{ env.IMAGE_OWNER }}/get-my-subtitle-downloader:${VERSION}\`"
            echo "- \`translator\`: \`ghcr.io/${{ env.IMAGE_OWNER }}/get-my-subtitle-translator:${VERSION}\`"
            echo "- \`scanner\`: \`ghcr.io/${{ env.IMAGE_OWNER }}/get-my-subtitle-scanner:${VERSION}\`"
            echo "- \`consumer\`: \`ghcr.io/${{ env.IMAGE_OWNER }}/get-my-subtitle-consumer:${VERSION}\`"
            echo ""
            echo "All images are also tagged with \`latest\` for convenience."
          } > release_notes.md
          
          # Output changelog for GitHub release
          {
            echo "changelog<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check-tag
        run: |
          RELEASE_TAG="${{ needs.calculate-version.outputs.release-tag }}"
          if git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Tag ${RELEASE_TAG} already exists, skipping release creation"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag ${RELEASE_TAG} does not exist, will create release"
          fi

      - name: Create Release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag: ${{ needs.calculate-version.outputs.release-tag }}
          name: Release ${{ needs.calculate-version.outputs.release-tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: ${{ needs.calculate-version.outputs.is-prerelease }}
          draft: false
          generate_notes: false


